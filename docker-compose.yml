# Un solo comando, una sola dirección: http://localhost:8000
# Los cambios en backend/ y frontend/ se reflejan al guardar el archivo (sin reconstruir).
# La primera vez tarda unos minutos porque instala las dependencias.

services:
  backend:
    image: python:3.12-slim
    working_dir: /code
    # Si faltan los datos de Cultivos (backend/data/cultivos), corre la pipeline una vez
    # antes de arrancar (~1 min). Para regenerarlos: docker compose run --rm backend
    #   sh -c "pip install -r pipeline/requirements.txt && python -m pipeline.cultivos"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             (test -f data/cultivos/meta.json ||
              (pip install --no-cache-dir -r pipeline/requirements.txt && python -m pipeline.cultivos) ||
              echo 'AVISO: la pipeline de Cultivos fallo; /api/cultivos respondera 404') &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/code
    environment:
      # Llave de la API de NASA (ver .env.example)
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
      # Credenciales de la API de Meteomatics (ver .env.example)
      - METEOMATICS_USER=${METEOMATICS_USER:-}
      - METEOMATICS_PASSWORD=${METEOMATICS_PASSWORD:-}
      - PYTHONDONTWRITEBYTECODE=1
      # En Windows los eventos de archivos no cruzan al contenedor: revisar por polling
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/frontend
      # node_modules vive dentro de Docker (no en tu carpeta) para evitar choques con Windows
      - frontend_node_modules:/frontend/node_modules
    ports:
      # Única puerta de entrada: el frontend; manda /api y /docs al backend
      - "${APP_PORT:-8000}:5173"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
