# Un solo comando, una sola dirección: http://localhost:8000
# Los cambios en backend/ y frontend/ se reflejan al guardar el archivo (sin reconstruir).
# La primera vez tarda unos minutos porque instala las dependencias.

services:
  backend:
    image: python:3.12-slim
    working_dir: /code
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/code
    environment:
      # Llave de la API de NASA (ver .env.example)
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
      - PYTHONDONTWRITEBYTECODE=1
      # En Windows los eventos de archivos no cruzan al contenedor: revisar por polling
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/frontend
      # node_modules vive dentro de Docker (no en tu carpeta) para evitar choques con Windows
      - frontend_node_modules:/frontend/node_modules
    ports:
      # Única puerta de entrada: el frontend; manda /api y /docs al backend
      - "${APP_PORT:-8000}:5173"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
